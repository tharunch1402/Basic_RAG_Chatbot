name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Check all RAG modules import
        run: uv run python -c "import rag.loader, rag.splitter, rag.embeddings, rag.vector_store, rag.retriever, rag.prompts, rag.llm, rag.rag_chain"