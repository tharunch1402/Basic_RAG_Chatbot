[project]
name = "basic-rag-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tharun Kumar", email = "tharunch2001@gmil.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
basic-rag-chatbot = "basic_rag_chatbot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
